[platformio]
default_envs = reader_v12, apps_v12

[env]
platform = espressif32@6.10.0
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#9207eb6ab2b96f66298e0488740218c17b006af7
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
  adafruit/Adafruit GFX Library@1.11.11
build_unflags = -std=gnu++11 -fno-exceptions
build_flags = -std=gnu++17 -fexceptions -DWIRELESS_PAPER -DINH_VERSION=\"0.4.1-alpha\" -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_LOOP_STACK_SIZE=16384

[env:reader_v12]
build_flags = ${env.build_flags} -DINH_APPS=0 -DINH_PANEL=12

[env:apps_v12]
build_flags = ${env.build_flags} -DINH_APPS=1 -DINH_PANEL=12

[env:reader_v11]
build_flags = ${env.build_flags} -DINH_APPS=0 -DINH_PANEL=11

[env:apps_v11]
build_flags = ${env.build_flags} -DINH_APPS=1 -DINH_PANEL=11
