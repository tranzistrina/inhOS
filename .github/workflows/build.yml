name: build-and-test
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/test.sh
      - run: node test/portal_test.cjs
      - run: pip install littlefs-python==0.19.0 Pillow==11.3.0 pyserial==3.5
      - run: python3 test/storage_test.py
      - run: python3 test/converter_test.py
      - run: python3 test/usb_test.py
      - run: python3 test/books_test.py
      - run: python3 test/plain_contents_test.py
      - run: bash -n desktop/inhOS-macOS.command
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [reader_v12, apps_v12, reader_v11, apps_v11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run -e ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: inhOS-${{ matrix.target }}-UNTESTED-ALPHA
          path: |
            .pio/build/${{ matrix.target }}/firmware.bin
            .pio/build/${{ matrix.target }}/firmware.elf
            .pio/build/${{ matrix.target }}/bootloader.bin
            .pio/build/${{ matrix.target }}/partitions.bin

  archive:
    needs: [core, firmware]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: firmware-input
      - name: Package firmware and source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          for target in ['reader_v12','apps_v12','reader_v11','apps_v11']:
              folder=Path('firmware-input')/('inhOS-'+target+'-UNTESTED-ALPHA')
              out=Path('.pio/build')/target;out.mkdir(parents=True,exist_ok=True)
              for name in ['firmware.bin','firmware.elf','bootloader.bin','partitions.bin']:
                  matches=list(folder.rglob(name));assert len(matches)==1,(target,name)
                  shutil.copy2(matches[0],out/name)
          PYCODE
          python3 tools/package.py reader_v12 apps_v12 reader_v11 apps_v11
          python3 tools/package_desktop.py
          cp build/inhOS-usb-clients.zip downloads/inhOS-usb-clients-0.4.1.zip
          sha256sum downloads/inhOS-usb-clients-0.4.1.zip > downloads/inhOS-usb-clients-0.4.1.zip.sha256
          cp build/inhOS-alpha.zip downloads/inhOS-0.4.1-alpha.zip
          mkdir -p downloads/apps_v12-0.4.1
          cp .pio/build/apps_v12/firmware.bin downloads/apps_v12-0.4.1/firmware.bin
          sha256sum downloads/apps_v12-0.4.1/firmware.bin > downloads/apps_v12-0.4.1/firmware.bin.sha256
          sha256sum downloads/inhOS-0.4.1-alpha.zip > downloads/inhOS-0.4.1-alpha.zip.sha256
      - name: Publish archive in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/inhOS-0.4.1-alpha.zip downloads/inhOS-0.4.1-alpha.zip.sha256 downloads/apps_v12-0.4.1/ downloads/inhOS-usb-clients-0.4.1.zip downloads/inhOS-usb-clients-0.4.1.zip.sha256
          git diff --cached --quiet || git commit -m "Publish alpha 0.4.1 legacy TXT contents fix"
          git push origin HEAD:main
